spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/integration3cx}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

  h2:
    console:
      enabled: false
